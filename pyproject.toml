[project]
name = "tkgs-navigator"
version = "0.2.0"
description = "Local TKGS discovery and recoverable bouquet updates for Enigma2"
requires-python = ">=3.8"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]  # sys.path bootstrap precedes project imports.

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["TKGSNavigator", "tests", "tools"]

[tool.mypy]
# mypy 2 checks against 3.10 at the lowest; 3.8 runtime support is covered by the CI test matrix.
python_version = "3.10"
strict = true
files = ["TKGSNavigator/core", "TKGSNavigator/worker.py"]
